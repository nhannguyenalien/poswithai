<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Đăng nhập — POS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css"/>
  <style>
    .btn-google {
      background: #fff;
      border: 1px solid #ddd;
      color: #3c4043;
      font-size: 1rem;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow .2s, background .2s;
      text-decoration: none;
    }
    .btn-google:hover { box-shadow: 0 2px 8px rgba(0,0,0,.15); background: #f8f8f8; color: #3c4043; }
    .google-icon { width: 22px; height: 22px; }
  </style>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-5">
    <div class="text-center mb-4">
      <div style="font-size:3rem">🏪</div>
      <h2 class="fw-bold mt-2">POS Đa Ngành</h2>
      <p class="text-muted">Phần mềm quản lý bán hàng</p>
    </div>

    <div class="card">
      <div class="card-body p-4">

        <div id="error-msg" class="alert alert-danger d-none mb-3"></div>

        <a href="/api/auth/google" class="btn-google mb-3">
          <!-- Google logo SVG -->
          <svg class="google-icon" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.4 30.3 0 24 0 14.7 0 6.7 5.5 2.9 13.5l7.8 6C12.3 13.5 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7C35.8 32 33 34.5 29.3 36l7.6 5.9C41.6 38 46.5 31.8 46.5 24.5z"/>
            <path fill="#FBBC05" d="M10.7 28.5c-.8-2.3-1.2-4.8-1.2-7.5s.4-5.2 1.2-7.5l-7.8-6C1.1 11.5 0 17.6 0 24s1.1 12.5 2.9 16.5l7.8-6z"/>
            <path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.4-5.6L31.8 36.5C29.7 38 27 39 24 39c-6.3 0-11.7-4-13.3-9.5l-7.8 6C6.7 43.5 14.7 48 24 48z"/>
          </svg>
          Đăng nhập bằng Google
        </a>

        <div class="text-center text-muted" style="font-size:.85rem">
          Chỉ dùng email Google để xác thực.<br/>
          Không lưu mật khẩu.
        </div>

      </div>
    </div>

    <div class="text-center mt-3 text-muted" style="font-size:.8rem">
      Lần đầu đăng nhập → hệ thống sẽ hỏi thông tin tiệm
    </div>
  </div>
</div>

<script type="module">
  import { getToken, clearSession } from "/js/auth.js";

  // Nếu đã đăng nhập rồi thì vào dashboard
  if (getToken()) window.location.href = "/dashboard.html";

  // Hiện lỗi nếu có (từ callback redirect)
  const params = new URLSearchParams(window.location.search);
  const errMap = {
    invalid_state:    "Phiên đăng nhập không hợp lệ, thử lại.",
    token_failed:     "Không lấy được token từ Google, thử lại.",
    profile_failed:   "Không lấy được thông tin Google, thử lại.",
    account_suspended:"Tài khoản đã bị khóa, liên hệ quản trị.",
    access_denied:    "Bạn đã huỷ đăng nhập.",
  };
  const err = params.get("error");
  if (err) {
    const el = document.getElementById("error-msg");
    el.textContent = errMap[err] || `Lỗi: ${err}`;
    el.classList.remove("d-none");
    clearSession();
  }
</script>
</body>
</html>
