<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Danh sách đơn hàng — POS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css"/>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    .filter-bar { background: #f8fafc; border-radius: 8px; }
    .debt-cell { font-weight: 600; }
    .summary-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; }
  </style>
</head>
<body>
<div class="page">
  <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
  </aside>

  <div class="page-wrapper">
    <div class="page-header">
      <div class="container-xl">
        <div class="row align-items-center">
          <div class="col"><h2 class="page-title">🧾 Danh sách đơn hàng</h2></div>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="container-xl">

        <!-- Bộ lọc -->
        <div class="card mb-3">
          <div class="card-body filter-bar">
            <div class="row g-2 align-items-end">
              <div class="col-md-3">
                <label class="form-label small mb-1">Tìm kiếm</label>
                <input id="f-search" type="text" class="form-control form-control-sm" placeholder="Số HĐ, tên hoặc SĐT khách..."/>
              </div>
              <div class="col-md-2">
                <label class="form-label small mb-1">Loại đơn</label>
                <select id="f-type" class="form-select form-select-sm">
                  <option value="">Tất cả</option>
                  <option value="retail">Bán lẻ</option>
                  <option value="wholesale">Bán sỉ</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label small mb-1">Trạng thái</label>
                <select id="f-status" class="form-select form-select-sm">
                  <option value="">Tất cả</option>
                  <option value="pending">Chờ thanh toán</option>
                  <option value="completed">Hoàn thành</option>
                  <option value="cancelled">Đã huỷ</option>
                  <option value="refunded">Đã hoàn tiền</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label small mb-1">Từ ngày</label>
                <input id="f-from" type="date" class="form-control form-control-sm"/>
              </div>
              <div class="col-md-2">
                <label class="form-label small mb-1">Đến ngày</label>
                <input id="f-to" type="date" class="form-control form-control-sm"/>
              </div>
              <div class="col-md-1 d-flex gap-1">
                <button class="btn btn-primary btn-sm w-100" onclick="loadOrders()">Lọc</button>
              </div>
              <div class="col-12">
                <label class="form-check mb-0">
                  <input class="form-check-input" type="checkbox" id="f-include-quick" onchange="loadOrders()"/>
                  <span class="form-check-label small">📝 Hiện cả hoá đơn nháp</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Bảng đơn hàng -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Đơn hàng</h3>
            <div class="card-options">
              <span id="result-count" class="badge bg-blue-lt"></span>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table card-table table-vcenter">
              <thead>
                <tr>
                  <th>Số HĐ</th>
                  <th>Ngày</th>
                  <th>Loại</th>
                  <th>Khách hàng</th>
                  <th class="text-end">Tổng tiền</th>
                  <th class="text-end">Đã thu</th>
                  <th class="text-end">Nợ tiền</th>
                  <th class="text-end">Nợ vàng</th>
                  <th>Trạng thái</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="order-rows">
                <tr><td colspan="10" class="text-muted text-center py-4">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Modal chi tiết đơn -->
<div class="modal modal-blur fade" id="modal-detail" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Chi tiết đơn hàng — <span id="d-order-number"></span></h5>
        <div class="dropdown me-2" id="d-more-wrap" style="display:none">
          <button class="btn btn-sm btn-ghost-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">⋮ Khác</button>
          <ul class="dropdown-menu dropdown-menu-end" id="d-more-menu"></ul>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="d-body">
        <div class="text-muted text-center py-4">Đang tải...</div>
      </div>
      <div class="modal-footer" id="d-footer"></div>
    </div>
  </div>
</div>

<!-- Modal thu tiền -->
<div class="modal modal-blur fade" id="modal-pay" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="pay-modal-title">Thu tiền</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pay-order-id"/>
        <div class="mb-2 text-muted small" id="pay-remaining-note"></div>
        <div class="mb-3">
          <label class="form-label">Phương thức</label>
          <select id="pay-method" class="form-select">
            <option value="cash">💵 Tiền mặt</option>
            <option value="transfer">🏦 Chuyển khoản</option>
            <option value="card">💳 Thẻ ngân hàng</option>
            <option value="installment">📅 Trả góp / Nợ</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Số tiền</label>
          <input id="pay-amount" type="number" class="form-control" step="1000" min="0"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-primary" onclick="submitPayment()">Xác nhận</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/js/tabler.min.js"></script>
<script type="module">
import { requireLogin } from "/js/auth.js";
import { initSidebar } from "/js/sidebar.js";
import { api } from "/js/api.js";
import { printInvoiceA4 } from "/js/print.js";

requireLogin();
initSidebar();

const fmtVND  = n => new Intl.NumberFormat("vi-VN").format(Math.round(n || 0)) + " đ";
const fmtGold = n => Number(n || 0).toFixed(3) + " chỉ";
const fmtDate = s => new Date(s).toLocaleString("vi-VN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });

const statusMap  = { pending:["bg-yellow-lt","Chờ TT"], completed:["bg-green-lt","Hoàn thành"], cancelled:["bg-red-lt","Đã huỷ"], refunded:["bg-secondary-lt","Đã hoàn tiền"] };
const statusBadge = s => `<span class="badge ${statusMap[s]?.[0]||"bg-secondary-lt"}">${statusMap[s]?.[1]||s}</span>`;
const typeBadge = t => t === "wholesale" ? `<span class="badge bg-purple-lt">Bán sỉ</span>` : `<span class="badge bg-azure-lt">Bán lẻ</span>`;

let currentOrders = [];

window.loadOrders = async function() {
  const tbody = document.getElementById("order-rows");
  tbody.innerHTML = `<tr><td colspan="10" class="text-muted text-center py-4">Đang tải...</td></tr>`;

  const params = new URLSearchParams();
  const search = document.getElementById("f-search").value.trim();
  const type   = document.getElementById("f-type").value;
  const status = document.getElementById("f-status").value;
  const from   = document.getElementById("f-from").value;
  const to     = document.getElementById("f-to").value;
  if (search) params.set("search", search);
  if (type)   params.set("order_type", type);
  if (status) params.set("status", status);
  if (from)   params.set("from", from);
  if (to)     params.set("to", to);
  if (document.getElementById("f-include-quick").checked) params.set("include_quick", "1");

  try {
    const { orders } = await api.get(`/api/orders?${params.toString()}`);
    currentOrders = orders;
    document.getElementById("result-count").textContent = `${orders.length} đơn`;

    tbody.innerHTML = orders.length ? orders.map(o => {
      const total    = parseInt(o.total || 0);
      const paid     = parseInt(o.paid_amount || 0);
      // Cộng nợ cũ (chốt lúc lập đơn) vào cột "Nợ tiền"/"Nợ vàng" giống hệt khung chi tiết
      // — nếu chỉ hiện mỗi phần của riêng đơn này thì dễ hiểu lầm "còn nợ" dù thực ra đã
      // gần như hết nợ sau khi bù trừ với nợ cũ (VD đơn tự bán ra gần bằng đúng số tiệm
      // đang nợ khách từ trước) — bug thật đã gặp (đơn DHMS9UCTU1UFU: 0.0545 chỉ nợ đơn
      // này, nhưng nợ cũ ghi -0.055 chỉ ⇒ ròng gần như 0, không còn nợ thật).
      const oldMoneyDebt = parseInt(o.old_money_debt || 0);
      const oldGoldDebt99 = parseFloat(o.old_gold_debt_99 || 0);
      const moneyNet = (total - paid) + oldMoneyDebt;
      const goldDebt = (parseFloat(o.gold_debt_99) || 0) + oldGoldDebt99;
      return `
        <tr>
          <td class="fw-medium">${o.order_number}</td>
          <td class="text-muted">${fmtDate(o.created_at)}</td>
          <td>${typeBadge(o.order_type)} ${o.is_quick ? `<span class="badge bg-orange-lt">📝 Nháp</span>` : ""}</td>
          <td>${o.customer_name || "<span class='text-muted'>Khách vãng lai</span>"}</td>
          <td class="text-end">${fmtVND(total)}</td>
          <td class="text-end">${fmtVND(paid)}</td>
          <td class="text-end debt-cell ${moneyNet !== 0 ? "text-danger" : "text-muted"}">${moneyNet !== 0 ? fmtVND(moneyNet) : "—"}</td>
          <td class="text-end debt-cell ${Math.abs(goldDebt) > 0.0005 ? "text-danger" : "text-muted"}">${Math.abs(goldDebt) > 0.0005 ? fmtGold(goldDebt) : "—"}</td>
          <td>${statusBadge(o.status)}</td>
          <td class="text-end"><button class="btn btn-sm btn-ghost-secondary" onclick="openDetail('${o.id}')">Xem</button></td>
        </tr>`;
    }).join("") : `<tr><td colspan="10" class="text-muted text-center py-4">Không tìm thấy đơn hàng nào</td></tr>`;
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="10" class="text-danger text-center py-4">${err.message}</td></tr>`;
  }
};

// ── CHI TIẾT ĐƠN ─────────────────────────────────────────
let currentDetail = null;

window.openDetail = async function(orderId) {
  document.getElementById("d-order-number").textContent = "...";
  document.getElementById("d-body").innerHTML = `<div class="text-muted text-center py-4">Đang tải...</div>`;
  document.getElementById("d-footer").innerHTML = "";
  // getOrCreateInstance thay vì `new Modal()` — hàm này bị gọi lại nhiều lần để refresh
  // dữ liệu trong lúc modal ĐANG mở (VD sau khi đổi trạng thái đơn), `new Modal().show()`
  // trên 1 modal đã mở sẽ tạo thêm backdrop mới mà không dọn cái cũ, để lại lớp overlay mờ
  // kẹt trên trang không thao tác được gì sau khi đóng modal.
  bootstrap.Modal.getOrCreateInstance(document.getElementById("modal-detail")).show();

  try {
    const data = await api.get(`/api/orders/${orderId}`);
    currentDetail = data;
    renderDetail(data);
  } catch (err) {
    document.getElementById("d-body").innerHTML = `<div class="text-danger text-center py-4">${err.message}</div>`;
  }
};

function renderDetail(data) {
  const { order, items, payments } = data;
  document.getElementById("d-order-number").textContent = order.order_number;

  // Nhận diện toa vàng qua gold_sold_99/gold_bought_99, KHÔNG dùng gold_price_99>0 — giá
  // vàng có thể để trống nếu để nguyên hết thành nợ vàng (không quy đồng nào ra tiền).
  const goldSold99     = parseFloat(order.gold_sold_99) || 0;
  const goldBought99   = parseFloat(order.gold_bought_99) || 0;
  const hasGoldModel   = goldSold99 > 0 || goldBought99 > 0;
  const goldRemaining99= goldSold99 - goldBought99;
  const goldToMoney99  = parseFloat(order.gold_to_money_99) || 0;
  const goldDebt99     = parseFloat(order.gold_debt_99) || 0;

  let tradeIns = [];
  try { tradeIns = order.trade_in_details ? JSON.parse(order.trade_in_details) : []; } catch { tradeIns = []; }
  const isGoldTradeIn = tradeIns.length > 0 && tradeIns[0].conv99 !== undefined;

  const paidTotal  = payments.reduce((s,p) => s + parseInt(p.amount||0), 0);
  const total      = parseInt(order.total || 0);
  const isRefund   = total < 0;
  // paidTotal đã có dấu khớp quy ước của total (thanh toán thường dương, hoàn tiền lưu âm —
  // xem submitPayment ở dưới), nên total - paidTotal là số dư CÓ DẤU của riêng đơn này,
  // không cần xét isRefund riêng ở bước này (dương = khách còn nợ, âm = tiệm còn nợ khách).
  const thisOrderNet = total - paidTotal;
  const moneyDebt  = Math.abs(thisOrderNet);
  const methodLabel = m => ({cash:"Tiền mặt",card:"Thẻ ngân hàng",transfer:"Chuyển khoản",installment:"Trả góp"}[m]||m);

  // Nợ cũ chốt lúc lập đơn (snapshot, xem migrate_order_old_debt.sql) — cộng vào số nợ
  // cuối cùng hiển thị ở đây để khớp với những gì đã thấy lúc tạo đơn (trang Bán sỉ) và
  // trên hoá đơn in, thay vì chỉ hiện mỗi phần nợ của riêng đơn này gây hiểu lầm "hết nợ".
  // Cộng CÓ DẤU rồi mới lấy độ lớn — cộng 2 độ lớn của 2 chiều ngược nhau sẽ ra sai hẳn
  // (bug thật đã gặp, xem functions/api/customers/[id]/debt.js).
  const oldMoneyDebt = parseInt(order.old_money_debt) || 0;
  const oldGoldDebt99 = parseFloat(order.old_gold_debt_99) || 0;
  const combinedNet = thisOrderNet + oldMoneyDebt;
  const combinedMoneyDebt = Math.abs(combinedNet);
  const combinedIsShopOwes = combinedNet < 0;
  const combinedGoldDebt99 = goldDebt99 + oldGoldDebt99;
  const combinedGoldIsShopOwes = combinedGoldDebt99 < 0;

  document.getElementById("d-body").innerHTML = `
    <div class="row mb-3">
      <div class="col-md-6">
        <div class="text-muted small">Khách hàng</div>
        <div class="fw-medium">${order.customer_name || "Khách vãng lai"} ${order.customer_phone ? `— ${order.customer_phone}` : ""}</div>
        ${order.customer_id_card ? `<div class="small text-muted">CCCD: ${order.customer_id_card}</div>` : ""}
        ${order.customer_address ? `<div class="small text-muted">${order.customer_address}</div>` : ""}
      </div>
      <div class="col-md-6 text-md-end">
        <div>${typeBadge(order.order_type)} ${statusBadge(order.status)} ${order.is_quick ? `<span class="badge bg-orange-lt">📝 Nháp</span>` : ""}</div>
        <div class="text-muted small">${fmtDate(order.created_at)}</div>
        ${hasGoldModel ? `<div class="small">💰 Giá vàng 99/chỉ áp dụng: <strong>${fmtVND(order.gold_price_99)}</strong>/chỉ</div>` : ""}
      </div>
      ${order.is_quick ? `
        <div class="col-12 mt-2">
          <div class="text-muted small">📝 Ghi chú</div>
          <div class="border rounded p-2 ${order.notes ? "" : "text-muted fst-italic"}">${order.notes || "Chưa có ghi chú"}</div>
        </div>
      ` : (order.notes ? `<div class="col-12 mt-2"><div class="text-muted small">Ghi chú</div><div>${order.notes}</div></div>` : "")}
    </div>

    <table class="table table-sm table-vcenter mb-3">
      <thead><tr>
        <th>Sản phẩm</th><th class="text-center">SL</th>
        ${hasGoldModel ? `<th class="text-end">TL+hột</th><th class="text-end">Hột</th><th class="text-end">TL vàng</th><th class="text-center">Tuổi</th><th class="text-end">Quy 99</th>` : ""}
        <th class="text-end">${hasGoldModel ? "Công/món" : "Đơn giá"}</th><th class="text-end">Thành tiền</th>
      </tr></thead>
      <tbody>
        ${items.map(i => {
          let md = null;
          try { md = i.metal_details ? JSON.parse(i.metal_details) : null; } catch { md = null; }
          return `
          <tr>
            <td>${i.product_name}${i.sku ? ` <span class="text-muted small">(${i.sku})</span>` : ""}</td>
            <td class="text-center">${i.quantity}</td>
            ${hasGoldModel ? `
              <td class="text-end">${md ? md.grossWeight.toFixed(3) : "—"}</td>
              <td class="text-end">${md ? (md.stoneWeight||0).toFixed(3) : "—"}</td>
              <td class="text-end">${md ? (md.netWeight * i.quantity).toFixed(3) : "—"}</td>
              <td class="text-center">${md ? md.purity : "—"}</td>
              <td class="text-end">${md ? md.conv99.toFixed(3) : "—"}</td>
            ` : ""}
            <td class="text-end">${fmtVND(i.unit_price)}</td>
            <td class="text-end fw-medium">${fmtVND(i.total)}</td>
          </tr>`; }).join("")}
      </tbody>
    </table>

    ${tradeIns.length ? `
      <div class="fw-bold mb-1">🔄 Hàng cũ khách trả (thu lại)</div>
      <table class="table table-sm table-vcenter mb-3">
        <thead><tr>
          <th>Tên hàng</th>
          ${isGoldTradeIn ? `<th class="text-center">Tuổi</th><th class="text-end">TL luôn hột</th><th class="text-end">Hột</th><th class="text-end">TL Vàng</th><th class="text-end">Quy 99 (chỉ)</th>`
                          : `<th class="text-end">TL (chỉ)</th><th class="text-end">Giá vàng/chỉ</th><th class="text-end">Thành tiền</th>`}
        </tr></thead>
        <tbody>
          ${tradeIns.map(t => isGoldTradeIn ? `
            <tr>
              <td>${t.name||""}</td>
              <td class="text-center">${t.purity??""}</td>
              <td class="text-end">${(parseFloat(t.grossWeight ?? t.weight)||0).toFixed(3)}</td>
              <td class="text-end">${(parseFloat(t.stoneWeight)||0).toFixed(3)}</td>
              <td class="text-end">${(parseFloat(t.weight)||0).toFixed(3)}</td>
              <td class="text-end">${(parseFloat(t.conv99)||0).toFixed(3)}</td>
            </tr>
          ` : `
            <tr><td>${t.name||""}</td><td class="text-end">${t.weight??""}</td><td class="text-end">${fmtVND(t.pricePerUnit)}</td><td class="text-end">${fmtVND(t.amount)}</td></tr>
          `).join("")}
        </tbody>
      </table>
    ` : ""}

    <div class="row g-3">
      ${hasGoldModel ? `
        <div class="col-md-5">
          <div class="summary-box">
            <div class="fw-bold mb-2">🥇 Quy đổi vàng 99</div>
            <div class="d-flex justify-content-between small mb-1"><span class="text-muted">Bán ra (99):</span><span>${goldSold99.toFixed(3)} chỉ</span></div>
            <div class="d-flex justify-content-between small mb-1"><span class="text-muted">Mua vào (99):</span><span>${goldBought99.toFixed(3)} chỉ</span></div>
            <div class="d-flex justify-content-between small mb-1"><span class="text-muted">Còn lại (99):</span><span class="fw-bold">${goldRemaining99.toFixed(3)} chỉ</span></div>
            <div class="d-flex justify-content-between small mb-1"><span class="text-muted">Quy ra tiền (99):</span><span>${goldToMoney99.toFixed(3)} chỉ</span></div>
            <div class="d-flex justify-content-between small"><span class="text-muted">Tiền công:</span><span>${fmtVND(order.making_fee_total)}</span></div>
            ${Math.abs(combinedGoldDebt99) > 0.0005 ? `
              <hr class="my-2"/>
              <div class="d-flex justify-content-between"><span class="text-danger fw-bold">${combinedGoldIsShopOwes ? "Tiệm còn nợ khách vàng:" : "Nợ vàng còn lại:"}</span><span class="text-danger fw-bold">${Math.abs(combinedGoldDebt99).toFixed(3)} chỉ</span></div>
              ${Math.abs(oldGoldDebt99) > 0.0005 ? `<div class="text-muted small text-end">(gồm nợ cũ ${oldGoldDebt99 < 0 ? "tiệm nợ khách " : ""}${Math.abs(oldGoldDebt99).toFixed(3)} chỉ + đơn này ${goldDebt99.toFixed(3)} chỉ)</div>` : ""}
            ` : ""}
          </div>
        </div>
      ` : ""}
      <div class="${hasGoldModel ? "col-md-7" : "col-md-12"}">
        <div class="summary-box">
          <div class="d-flex justify-content-between mb-1"><span class="text-muted">Tạm tính:</span><span>${fmtVND(order.subtotal)}</span></div>
          ${parseInt(order.discount||0) > 0 ? `<div class="d-flex justify-content-between mb-1"><span class="text-muted">Chiết khấu:</span><span class="text-danger">- ${fmtVND(order.discount)}</span></div>` : ""}
          <hr class="my-2"/>
          <div class="d-flex justify-content-between mb-2"><span class="fw-bold">${isRefund ? "Tiệm cần hoàn khách:" : "Tổng cộng:"}</span><span class="h3 mb-0 text-primary">${fmtVND(Math.abs(total))}</span></div>
          ${payments.map(p => `<div class="d-flex justify-content-between small"><span class="text-muted">${methodLabel(p.method)} (${fmtDate(p.created_at)}):</span><span>${fmtVND(Math.abs(p.amount))}</span></div>`).join("")}
          ${combinedMoneyDebt > 0 ? `
            <div class="d-flex justify-content-between mt-1"><span class="text-danger fw-bold">${combinedIsShopOwes ? "Tiệm còn nợ khách:" : (hasGoldModel ? "Nợ tiền:" : "Còn nợ:")}</span><span class="text-danger fw-bold">${fmtVND(combinedMoneyDebt)}</span></div>
            ${oldMoneyDebt !== 0 ? `<div class="text-muted small text-end">(gồm nợ cũ ${oldMoneyDebt < 0 ? "tiệm nợ khách " : ""}${fmtVND(Math.abs(oldMoneyDebt))} + đơn này ${isRefund ? "tiệm nợ khách " : ""}${fmtVND(moneyDebt)})</div>` : ""}
          ` : ""}
        </div>
      </div>
    </div>
  `;

  const footerBtns = [];
  if (moneyDebt > 0) {
    footerBtns.push(`<button class="btn btn-primary" onclick='openPayModal("${order.id}", ${moneyDebt}, ${isRefund})'>${isRefund ? "💸 Hoàn thêm tiền" : "💰 Thu thêm tiền"}</button>`);
  }
  footerBtns.push(`<button class="btn btn-outline-secondary" onclick='printInvoiceA4("${order.id}", "${order.order_type}")'>🖨️ In lại</button>`);
  if (order.is_quick && order.status === "pending" && order.order_type === "wholesale") {
    footerBtns.push(`<a class="btn btn-outline-primary" href="/orders-wholesale.html?edit=${order.id}">✏️ Sửa hoá đơn nháp</a>`);
  }
  if (order.status === "pending") {
    footerBtns.push(`<button class="btn btn-outline-success" onclick='changeStatus("${order.id}", "completed", ${moneyDebt}, ${goldDebt99})'>✓ Đánh dấu hoàn thành</button>`);
  }
  document.getElementById("d-footer").innerHTML = footerBtns.join("");

  // "Huỷ đơn" là thao tác phá huỷ — tách riêng vào menu "⋮ Khác" trên header thay vì
  // nằm cạnh các nút thao tác thường dùng, để tránh bấm nhầm khi xem nhanh hoá đơn.
  const moreWrap = document.getElementById("d-more-wrap");
  const moreMenu = document.getElementById("d-more-menu");
  if (["pending","completed"].includes(order.status)) {
    moreWrap.style.display = "";
    moreMenu.innerHTML = `<li><a class="dropdown-item text-danger" href="#" onclick='changeStatus("${order.id}", "cancelled", ${moneyDebt}, ${goldDebt99}, "${order.customer_id || ""}", "${order.order_number}"); return false;'>✕ Huỷ đơn</a></li>`;
  } else {
    moreWrap.style.display = "none";
    moreMenu.innerHTML = "";
  }
}

window.printInvoiceA4 = printInvoiceA4;

window.changeStatus = async function(orderId, status, moneyDebtRemaining = 0, goldDebtRemaining = 0, customerId = "", orderNumber = "") {
  // "Hoàn thành" chỉ nên dùng khi đã thu/hoàn đủ — nếu còn nợ thật (tiền hoặc vàng) mà
  // vẫn bấm, số nợ KHÔNG biến mất (API tra cứu công nợ tính theo total-paid thật, không
  // tin vào status), nhưng dễ gây hiểu lầm "đơn này xong rồi" nên phải cảnh báo rõ trước.
  let preserveDebt = false;
  if (status === "completed" && (moneyDebtRemaining > 0 || Math.abs(goldDebtRemaining) > 0.0005)) {
    const parts = [];
    if (moneyDebtRemaining > 0) parts.push(`nợ tiền ${fmtVND(moneyDebtRemaining)}`);
    if (Math.abs(goldDebtRemaining) > 0.0005) parts.push(`nợ vàng ${fmtGold(goldDebtRemaining)}`);
    if (!confirm(`⚠️ Đơn này còn ${parts.join(" và ")} CHƯA thu/hoàn đủ.\n\nĐánh dấu "Hoàn thành" sẽ KHÔNG xoá công nợ này — công nợ khách hàng vẫn được tính đúng như thật, chỉ đổi trạng thái hiển thị của đơn.\n\nVẫn muốn đánh dấu hoàn thành?`)) return;
  } else if (status === "cancelled" && (moneyDebtRemaining > 0 || Math.abs(goldDebtRemaining) > 0.0005)) {
    // Đơn "Đã huỷ" bị LOẠI KHỎI công nợ khách hàng hoàn toàn (xem /api/customers/:id/debt
    // — WHERE status NOT IN ('cancelled','refunded')) — huỷ đơn còn nợ tức là xoá luôn
    // khoản nợ đó khỏi công nợ khách, trừ khi chuyển nó thành 1 bút toán nợ thủ công
    // trước khi huỷ. Phải hỏi rõ, không được tự ý xoá nợ thật của khách.
    const parts = [];
    if (moneyDebtRemaining > 0) parts.push(`nợ tiền ${fmtVND(moneyDebtRemaining)}`);
    if (Math.abs(goldDebtRemaining) > 0.0005) parts.push(`nợ vàng ${fmtGold(goldDebtRemaining)}`);
    if (!confirm(`⚠️ Đơn này còn ${parts.join(" và ")} CHƯA thu/hoàn đủ.\n\nHuỷ đơn sẽ XOÁ khoản nợ này khỏi công nợ khách hàng (đơn đã huỷ không tính vào công nợ nữa).\n\nVẫn muốn huỷ đơn?`)) return;
    preserveDebt = !!customerId && confirm(`Giữ lại khoản ${parts.join(" và ")} này cho khách (ghi thành 1 bút toán nợ thủ công riêng, không gắn với đơn đã huỷ) trước khi huỷ đơn?\n\nOK = Huỷ đơn nhưng GIỮ LẠI nợ.\nCancel = Huỷ đơn và XOÁ LUÔN khoản nợ.`);
  } else {
    const labels = { completed: "đánh dấu hoàn thành", cancelled: "huỷ" };
    if (!confirm(`Xác nhận ${labels[status] || status} đơn này?`)) return;
  }
  try {
    let createdAdjustmentId = null;
    if (preserveDebt) {
      const adj = await api.post(`/api/customers/${customerId}/debt`, {
        money_amount: moneyDebtRemaining,
        gold_amount_99: goldDebtRemaining,
        note: `Nợ giữ lại từ đơn đã huỷ ${orderNumber}`,
      });
      createdAdjustmentId = adj.id;
    }
    try {
      await api.put(`/api/orders/${orderId}`, { status });
    } catch (err) {
      // Huỷ đơn thất bại sau khi đã lỡ ghi bút toán giữ nợ ở trên — xoá lại bút toán đó
      // ngay, nếu không nợ sẽ bị tính trùng (vừa còn trong đơn chưa huỷ, vừa có thêm
      // bút toán riêng) cho tới khi ai đó phát hiện ra và xoá tay.
      if (createdAdjustmentId) await api.delete(`/api/debt-adjustments/${createdAdjustmentId}`).catch(() => {});
      throw err;
    }
    await openDetail(orderId);
    loadOrders();
  } catch (err) { alert(err.message); }
};

// ── THU TIỀN / HOÀN TIỀN ─────────────────────────────────
// modal-pay mở CHỒNG lên modal-detail đang mở (không đóng modal-detail lại) — cố tình tắt
// backdrop riêng của modal-pay (backdrop:false) để chỉ có ĐÚNG 1 backdrop (của modal-detail)
// tồn tại suốt lúc đó. 2 modal cùng tự tạo backdrop riêng rất dễ lệch nhau lúc đóng (Bootstrap
// đếm sai số modal đang mở), để kẹt lại 1 lớp overlay mờ không thao tác gì được — đúng lỗi
// thật đã gặp. modal-detail vẫn nguyên, không cần đóng/mở lại nên khỏi lo timing.
window.openPayModal = function(orderId, remaining, isRefund) {
  document.getElementById("pay-order-id").value = orderId;
  document.getElementById("pay-order-id").dataset.refund = isRefund ? "1" : "0";
  document.getElementById("pay-modal-title").textContent = isRefund ? "Hoàn tiền cho khách" : "Thu thêm tiền";
  document.getElementById("pay-remaining-note").textContent = isRefund
    ? `Còn cần hoàn: ${fmtVND(remaining)}` : `Còn nợ: ${fmtVND(remaining)}`;
  document.getElementById("pay-amount").value = remaining;
  bootstrap.Modal.getOrCreateInstance(document.getElementById("modal-pay"), { backdrop: false }).show();
};

// modal-pay đóng lại xoá luôn class "modal-open"/khoá cuộn trên body — kể cả khi
// modal-detail vẫn còn đang mở phía dưới (Bootstrap không tính tới trường hợp có 2 modal
// cùng mở) — trả lại class đó nếu modal-detail vẫn còn hiển thị, để tránh cuộn được nền
// phía sau trong lúc modal-detail vẫn đang mở.
document.getElementById("modal-pay").addEventListener("hidden.bs.modal", () => {
  if (document.getElementById("modal-detail").classList.contains("show")) {
    document.body.classList.add("modal-open");
  }
});

window.submitPayment = async function() {
  const orderId  = document.getElementById("pay-order-id").value;
  const isRefund = document.getElementById("pay-order-id").dataset.refund === "1";
  const amount   = Math.abs(parseInt(document.getElementById("pay-amount").value) || 0);
  if (!amount) return alert("Nhập số tiền");
  try {
    await api.post("/api/payments", {
      order_id: orderId,
      method:   document.getElementById("pay-method").value,
      amount:   isRefund ? -amount : amount,
    });
    bootstrap.Modal.getInstance(document.getElementById("modal-pay")).hide();
    await openDetail(orderId);
    loadOrders();
  } catch (err) { alert(err.message); }
};

document.getElementById("f-search").addEventListener("keydown", e => { if (e.key === "Enter") loadOrders(); });

// Cho phép mở thẳng chi tiết 1 đơn qua link (VD: từ modal công nợ bên trang bán sỉ) —
// ?open=<orderId>, kèm &include_quick=1 nếu đơn đó là hoá đơn nháp.
const initParams = new URLSearchParams(location.search);
if (initParams.get("include_quick") === "1") document.getElementById("f-include-quick").checked = true;
loadOrders().then(() => {
  const openId = initParams.get("open");
  if (openId) openDetail(openId);
});
</script>
