<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <title>Hoá đơn A4</title>
  <style>
    @page { size: A4; margin: 15mm 15mm 20mm 15mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Times New Roman', Times, serif; font-size: 13pt; color: #000; background: #fff; }

    /* Screen toolbar */
    .toolbar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      background: #1e293b; padding: 10px 16px;
      color: #fff; gap: 8px; align-items: center;
    }
    .toolbar button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-print { background: #22c55e; color: #fff; }
    .btn-close  { background: #ef4444; color: #fff; }

    @media screen {
      .toolbar { display: flex; }
      body { padding-top: 50px; background: #e5e7eb; }
      .a4 { background: #fff; max-width: 210mm; margin: 20px auto; padding: 20mm 18mm; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
    }
    @media print { .toolbar { display: none !important; } .a4 { padding: 0; } }

    /* Invoice layout */
    .header { display: flex; justify-content: space-between; margin-bottom: 16px; align-items: flex-start; }
    .shop-info h1 { font-size: 18pt; font-weight: bold; }
    .shop-info p  { font-size: 11pt; margin: 2px 0; }
    .invoice-title { text-align: right; }
    .invoice-title h2 { font-size: 22pt; font-weight: bold; }
    .invoice-title .inv-no { font-size: 12pt; margin-top: 4px; }
    .invoice-title .inv-date { font-size: 11pt; font-style: italic; }

    .divider { border-top: 2px solid #000; margin: 10px 0; }
    .divider-thin { border-top: 1px solid #ccc; margin: 8px 0; }

    .customer-grid {
      display: grid; grid-template-columns: auto 1fr auto 1fr;
      gap: 4px 12px; margin: 10px 0; font-size: 12pt;
    }
    .customer-grid .label { font-weight: bold; white-space: nowrap; }
    .customer-grid .val   { border-bottom: 1px dotted #999; padding-bottom: 2px; }

    /* Items table */
    table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    th, td { border: 1px solid #000; padding: 5px 7px; vertical-align: middle; }
    th { background: #f3f4f6; font-weight: bold; text-align: center; font-size: 12pt; }
    td.center { text-align: center; }
    td.right  { text-align: right; }
    tfoot td  { background: #f9fafb; font-weight: bold; }

    /* Totals */
    .totals { display: flex; justify-content: flex-end; margin-top: 8px; }
    .totals-table { width: 260px; border-collapse: collapse; }
    .totals-table th { text-align: left; padding: 4px 8px; font-weight: bold; border: none; background: none; width: 150px; }
    .totals-table td { padding: 4px 8px; text-align: right; border: none; background: none; }
    .totals-table .total-final th,
    .totals-table .total-final td { font-size: 15pt; font-weight: bold; border-top: 2px solid #000; padding-top: 6px; }
    .totals-table .debt-row th,
    .totals-table .debt-row td { color: #dc2626; }

    /* Payment info */
    .payment-info { margin-top: 10px; font-size: 11pt; }
    .payment-info table { border: none; width: auto; }
    .payment-info td { border: none; padding: 3px 12px 3px 0; }

    /* Signatures */
    .signatures { display: flex; justify-content: space-around; margin-top: 30px; text-align: center; }
    .signatures .sig-box { width: 180px; }
    .signatures .sig-line { border-top: 1px solid #000; margin-top: 50px; padding-top: 4px; font-size: 11pt; }

    /* Notes */
    .notes { font-size: 11pt; font-style: italic; margin-top: 8px; color: #555; }

    /* Mẫu "Hoá Đơn Bán Hàng" theo form tham chiếu (bán sỉ vàng) */
    .ref-shop { text-align: center; font-size: 10.5pt; color: #444; }
    .ref-title { text-align: center; font-size: 20pt; font-weight: bold; margin-top: 2px; }
    .ref-title .draft-tag { color: #dc2626; font-size: 13pt; }
    .ref-inv-no { text-align: center; font-size: 11pt; margin-top: 2px; }
    .ref-date { font-style: italic; margin: 10px 0 12px; }
    .ref-date .val { border-bottom: 1px dotted #999; padding: 0 30px 0 6px; }
    .ref-customer { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 12pt; margin-bottom: 10px; }
    .ref-customer .val { border-bottom: 1px dotted #999; padding: 0 6px; }
    tfoot td.total-row-red { color: #dc2626; }
    .stat-title { font-weight: bold; text-decoration: underline; margin: 14px 0 4px; font-size: 12pt; }
    .stat-cols { display: flex; gap: 20px; align-items: flex-start; }
    .stat-cols > div { flex: 1; }
    .stat-table { width: 100%; border-collapse: collapse; margin: 0 0 8px; }
    .stat-table th, .stat-table td { border: 1px solid #000; padding: 4px 8px; font-size: 11.5pt; }
    .stat-table th { background: none; font-weight: bold; text-align: left; }
    .stat-table td { text-align: right; }
    .stat-table .total-final th,
    .stat-table .total-final td { font-size: 13.5pt; font-weight: bold; border-top: 2px solid #000; }
    .stat-table .debt-row th,
    .stat-table .debt-row td { color: #dc2626; }

    @media print {
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button class="btn-print" onclick="window.print()">🖨️ In hoá đơn</button>
  <button class="btn-close" onclick="window.close()">✕ Đóng</button>
  <span id="inv-title-bar" style="font-size:13px; margin-left:12px;"></span>
</div>

<div class="a4" id="invoice">
  <div class="center" style="padding:40px; color:#999">Đang tải hoá đơn...</div>
</div>

<script type="module">
import { getToken } from "/js/auth.js";

const params  = new URLSearchParams(location.search);
const orderId = params.get("order_id");
const type    = params.get("type") || "retail"; // retail | wholesale

async function load() {
  if (!orderId) { document.getElementById("invoice").textContent = "Thiếu order_id"; return; }

  const [orderRes, settingsRes] = await Promise.all([
    fetch(`/api/orders/${orderId}`, { headers: { Authorization: "Bearer " + getToken() } }).then(r => r.json()),
    fetch("/api/settings",          { headers: { Authorization: "Bearer " + getToken() } }).then(r => r.json()).catch(() => ({ settings: {} })),
  ]);

  const { order, items, payments, paid_amount, remaining } = orderRes;
  const settings   = settingsRes.settings || {};
  const shopName   = settings.shop_name    || "TÊN CỬA HÀNG";
  const shopAddr   = settings.shop_address || "Địa chỉ cửa hàng";
  const shopPhone  = settings.shop_phone   || "";
  const shopTax    = settings.tax_code     || "";

  const fmtVND = n => new Intl.NumberFormat("vi-VN").format(Math.round(n || 0)) + " đ";
  const today  = new Date();
  const dateStr= `Ngày ${today.getDate()} tháng ${today.getMonth()+1} năm ${today.getFullYear()}`;

  const paidTotal  = payments?.reduce((s,p) => s + parseInt(p.amount||0), 0) || 0;
  // Sign-aware giống orders-list.html: total>=0 (khách nợ tiệm) và total<0 (tiệm nợ khách,
  // toa hàng cũ thu vào nhiều hơn giá trị mua) đều tính đúng chiều, không để lộ số âm.
  const orderTotalInt = parseInt(order.total || 0);
  // paidTotal có dấu khớp quy ước của total (thanh toán dương, hoàn tiền lưu âm), nên hiệu
  // số này là số dư CÓ DẤU của riêng toa này — dùng nguyên để cộng dồn nợ cũ bên dưới,
  // chỉ lấy Math.abs() lúc hiển thị.
  const thisOrderNet = orderTotalInt - paidTotal;
  const debtAmount = Math.abs(thisOrderNet);

  const methodLabel = m => ({cash:"Tiền mặt",card:"Thẻ ngân hàng",transfer:"Chuyển khoản",installment:"Trả góp"}[m]||m);

  // Toa bán sỉ vàng theo mô hình "quy về 99". Nhận diện qua gold_sold_99/gold_bought_99,
  // KHÔNG dùng gold_price_99>0 — giá vàng có thể để trống nếu nhân viên để nguyên hết
  // thành nợ vàng (không quy đồng nào ra tiền), toa đó vẫn phải hiện đúng theo form vàng.
  const goldSold99    = parseFloat(order.gold_sold_99) || 0;
  const goldBought99  = parseFloat(order.gold_bought_99) || 0;
  const hasGoldModel  = goldSold99 > 0 || goldBought99 > 0;
  const goldRemaining99 = goldSold99 - goldBought99;
  const goldToMoney99 = parseFloat(order.gold_to_money_99) || 0;
  const goldDebt99    = parseFloat(order.gold_debt_99) || 0;

  // Hàng cũ khách trả — 2 định dạng tuỳ trang tạo đơn: bán sỉ (quy 99, có "conv99")
  // hay bán lẻ (tính thẳng ra tiền, có "amount").
  let tradeIns = [];
  try { tradeIns = order.trade_in_details ? JSON.parse(order.trade_in_details) : []; } catch { tradeIns = []; }
  const isGoldTradeIn = tradeIns.length > 0 && tradeIns[0].conv99 !== undefined;

  // Mẫu hoá đơn theo form tham chiếu (khách yêu cầu in bán sỉ vàng giống hệt mẫu cũ).
  const useRefLayout = type === "wholesale" && hasGoldModel;
  const shortDate = new Date(order.created_at || Date.now()).toLocaleDateString("vi-VN");
  const goldMoneyValue = Math.round(goldToMoney99 * (parseFloat(order.gold_price_99) || 0));
  const preDiscountAmt = (parseInt(order.subtotal || 0)) + goldMoneyValue;
  const discountPct = preDiscountAmt > 0 ? Math.round((parseInt(order.discount || 0) / preDiscountAmt) * 1000) / 10 : 0;

  // Cộng dồn nợ cũ (chốt lúc lập đơn) vào số nợ cuối cùng để khách/nhân viên thấy đúng
  // tổng đang nợ tính đến toa này — không đổi order.total/gold_debt_99 đã lưu, chỉ gộp
  // lúc hiển thị. Phải cộng bằng số CÓ DẤU rồi mới lấy độ lớn — cộng 2 độ lớn của 2 chiều
  // ngược nhau (nợ cũ >< toa này) sẽ ra sai hẳn, có thể đảo chiều ai nợ ai (bug thật đã
  // gặp, xem functions/api/customers/[id]/debt.js).
  const oldMoneyDebtForTotal = parseInt(order.old_money_debt) || 0;
  const combinedNetForTotal = thisOrderNet + oldMoneyDebtForTotal;
  const debtAmountWithOld = Math.abs(combinedNetForTotal);
  const debtWithOldIsShopOwes = combinedNetForTotal < 0;
  const goldDebtWithOld = goldDebt99 + (parseFloat(order.old_gold_debt_99) || 0);
  const goldDebtWithOldIsShopOwes = goldDebtWithOld < 0;

  // Dòng "Tổng Hàng Giao" — cộng dồn trực tiếp từ metal_details từng dòng (đã lưu sẵn
  // lúc tạo đơn) để khớp tuyệt đối với số hiển thị trên từng dòng, không tính lại.
  let wsTotalQty = 0, wsTotalGross = 0, wsTotalStone = 0, wsTotalNet = 0, wsTotalConv = 0, wsTotalMoney = 0;
  (items || []).forEach(item => {
    let md = null;
    try { md = item.metal_details ? JSON.parse(item.metal_details) : null; } catch { md = null; }
    wsTotalQty   += parseInt(item.quantity) || 0;
    wsTotalMoney += parseInt(item.total) || 0;
    if (md) {
      wsTotalGross += (md.grossWeight || 0) * item.quantity;
      wsTotalStone += (md.stoneWeight || 0) * item.quantity;
      wsTotalNet   += (md.netWeight   || 0) * item.quantity;
      wsTotalConv  += md.conv99 || 0;
    }
  });

  let tiTotalGross = 0, tiTotalStone = 0, tiTotalNet = 0;
  tradeIns.forEach(t => {
    tiTotalGross += parseFloat(t.grossWeight ?? t.weight) || 0;
    tiTotalStone += parseFloat(t.stoneWeight) || 0;
    tiTotalNet   += parseFloat(t.weight) || 0;
  });

  document.getElementById("invoice").innerHTML = useRefLayout ? `
    <!-- HEADER theo mẫu tham chiếu -->
    <div class="ref-shop">${shopName}${shopAddr ? " — " + shopAddr : ""}${shopPhone ? " — ĐT: " + shopPhone : ""}</div>
    <div class="ref-title">HOÁ ĐƠN BÁN HÀNG${order.is_quick ? ` <span class="draft-tag">(NHÁP)</span>` : ""}</div>
    <div class="ref-inv-no">Số: <strong>${order.order_number}</strong></div>
    <div class="ref-date">Ngày: <span class="val">${shortDate}</span></div>

    <!-- KHÁCH HÀNG -->
    <div class="ref-customer">
      <div><b>Khách hàng:</b> <span class="val">${order.customer_name || "Khách vãng lai"}</span></div>
      <div><b>Địa chỉ:</b> <span class="val">${order.customer_address || ""}</span></div>
      <div><b>ĐT:</b> <span class="val">${order.customer_phone || ""}</span></div>
    </div>

    <!-- BẢNG HÀNG HÓA -->
    <table>
      <thead>
        <tr>
          <th style="width:26px">STT</th>
          <th>Tên hàng</th>
          <th style="width:36px">SL</th>
          <th style="width:70px">TL vàng+hột</th>
          <th style="width:60px">TL hột</th>
          <th style="width:70px">Tổng TL Vàng</th>
          <th style="width:50px">Tuổi Vàng</th>
          <th style="width:70px">Sau Quy Đổi</th>
          <th style="width:80px">Giá Công/món</th>
          <th style="width:90px">Thành Tiền Công</th>
        </tr>
      </thead>
      <tbody>
        ${(items||[]).map((item, i) => {
          let md = null;
          try { md = item.metal_details ? JSON.parse(item.metal_details) : null; } catch { md = null; }
          return `
          <tr>
            <td class="center">${i+1}</td>
            <td>${item.product_name}${item.sku ? ` <span style="color:#666; font-size:11pt">(${item.sku})</span>` : ""}</td>
            <td class="center">${item.quantity}</td>
            <td class="center">${md ? md.grossWeight.toFixed(3) : "—"}</td>
            <td class="center">${md ? (md.stoneWeight||0).toFixed(3) : "—"}</td>
            <td class="center">${md ? (md.netWeight * item.quantity).toFixed(3) : "—"}</td>
            <td class="center">${md ? md.purity : "—"}</td>
            <td class="center">${md ? md.conv99.toFixed(3) : "—"}</td>
            <td class="right">${fmtVND(item.unit_price)}</td>
            <td class="right">${fmtVND(item.total)}</td>
          </tr>
        `; }).join("")}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2" style="text-align:right">Tổng Hàng Giao:</td>
          <td class="center total-row-red">${wsTotalQty} món</td>
          <td class="center">${wsTotalGross.toFixed(3)} chỉ</td>
          <td class="center">${wsTotalStone.toFixed(3)} chỉ</td>
          <td class="center">${wsTotalNet.toFixed(3)} chỉ</td>
          <td></td>
          <td class="center">${wsTotalConv.toFixed(3)} chỉ</td>
          <td></td>
          <td class="right">${fmtVND(wsTotalMoney)}</td>
        </tr>
      </tfoot>
    </table>

    <!-- HÀNG CŨ KHÁCH TRẢ (THU LẠI) -->
    ${tradeIns.length ? `
      <table>
        <thead>
          <tr>
            <th style="width:110px">Loại dê</th>
            <th style="width:80px">TL luôn hột</th>
            <th style="width:70px">Hột</th>
            <th style="width:80px">TL Vàng</th>
            <th style="width:60px">Quy đổi</th>
            <th style="width:110px">Dê sau quy đổi</th>
          </tr>
        </thead>
        <tbody>
          ${tradeIns.map(t => {
            const gross = parseFloat(t.grossWeight ?? t.weight) || 0;
            const stone = parseFloat(t.stoneWeight) || 0;
            const net   = parseFloat(t.weight) || 0;
            return `
            <tr>
              <td>${t.name || ""}</td>
              <td class="center">${gross.toFixed(3)}</td>
              <td class="center">${stone.toFixed(3)}</td>
              <td class="center">${net.toFixed(3)}</td>
              <td class="center">${t.purity ?? ""}</td>
              <td class="right">${(parseFloat(t.conv99)||0).toFixed(3)}</td>
            </tr>
          `; }).join("")}
        </tbody>
        <tfoot>
          <tr>
            <td style="text-align:right">Tổng cộng:</td>
            <td class="center">${tiTotalGross.toFixed(3)} chỉ</td>
            <td class="center">${tiTotalStone.toFixed(3)} chỉ</td>
            <td class="center">${tiTotalNet.toFixed(3)} chỉ</td>
            <td></td>
            <td class="right">${goldBought99.toFixed(3)} chỉ</td>
          </tr>
        </tfoot>
      </table>
    ` : ""}

    <!-- THỐNG KÊ VÀNG + TỔNG TIỀN -->
    <div class="stat-cols">
      <div>
        <div class="stat-title">Thống Kê Vàng (quy 99)</div>
        <table class="stat-table">
          <tr><th>Vàng giao mới:</th><td>${goldSold99.toFixed(3)} chỉ</td></tr>
          <tr><th>Nợ cũ (Vàng):</th><td>${(parseFloat(order.old_gold_debt_99) || 0).toFixed(3)} chỉ</td></tr>
          <tr><th>Vàng Chuyển/nhận:</th><td>0</td></tr>
          <tr><th>Dê khách trả:</th><td>${goldBought99.toFixed(3)} chỉ</td></tr>
          <tr><th>Còn lại (toa này):</th><td>${goldRemaining99.toFixed(3)} chỉ</td></tr>
          <tr><th>KH thanh toán (Vàng):</th><td>0</td></tr>
          <tr class="total-final ${Math.abs(goldDebtWithOld) > 0.0005 ? "debt-row" : ""}">
            <th>${Math.abs(goldDebtWithOld) <= 0.0005 ? "→ Vàng kết toa (đã hết nợ):" : goldDebtWithOldIsShopOwes ? "→ Vàng kết toa — Tiệm còn nợ khách:" : "→ Vàng kết toa — Khách còn nợ:"}</th>
            <td>${Math.abs(goldDebtWithOld) > 0.0005 ? Math.abs(goldDebtWithOld).toFixed(3) : "0.000"} chỉ</td>
          </tr>
        </table>
        <table class="stat-table">
          <tr><th>Trọng lượng quy tiền</th><th>Đơn giá</th><th>Thành tiền</th></tr>
          <tr><td class="center">${goldToMoney99.toFixed(3)}</td><td class="right">${fmtVND(order.gold_price_99)}</td><td class="right">${fmtVND(goldMoneyValue)}</td></tr>
        </table>
      </div>
      <div>
        <div class="stat-title" style="text-decoration:none; visibility:hidden;">.</div>
        <table class="stat-table total-box">
          <tr><th>Tổng tiền công:</th><td>${fmtVND(order.subtotal)}</td></tr>
          <tr><th>Chiết khấu %:</th><td>${discountPct}%</td></tr>
          <tr><th>Nợ cũ (Tiền):</th><td>${fmtVND(Math.abs(oldMoneyDebtForTotal))}${oldMoneyDebtForTotal < 0 ? " (tiệm nợ)" : ""}</td></tr>
          <tr><th>Tiền công trả khách:</th><td>0</td></tr>
          <tr><th>Tiền Vàng thanh toán:</th><td>${fmtVND(goldMoneyValue)}</td></tr>
          <tr><th>Tiền giảm cả toa:</th><td>${fmtVND(order.discount)}</td></tr>
          <tr class="total-final"><th>Tổng cộng:</th><td>${fmtVND(order.total)}</td></tr>
          <tr><th>Khách thanh toán:</th><td>${fmtVND(paidTotal)}</td></tr>
          <tr class="${debtAmountWithOld > 0 ? "debt-row" : ""}"><th>${debtWithOldIsShopOwes ? "Tiệm nợ khách lại:" : "Khách nợ lại:"}</th><td>${fmtVND(debtAmountWithOld)}</td></tr>
          ${oldMoneyDebtForTotal !== 0 ? `<tr><td colspan="2" style="font-size:9.5pt; color:#666; border:none; padding-top:0;">(gồm nợ cũ ${oldMoneyDebtForTotal < 0 ? "tiệm nợ khách " : ""}${fmtVND(Math.abs(oldMoneyDebtForTotal))} + toa này ${thisOrderNet < 0 ? "tiệm nợ khách " : ""}${fmtVND(debtAmount)})</td></tr>` : ""}
        </table>
      </div>
    </div>

    <!-- GHI CHÚ -->
    ${order.notes ? `<div class="notes">📝 Ghi chú: ${order.notes}</div>` : ""}

    <!-- CHỮ KÝ -->
    <div class="signatures">
      <div class="sig-box">
        <div>Khách hàng</div>
        <div class="sig-line">(Ký, ghi rõ họ tên)</div>
      </div>
      <div class="sig-box">
        <div>Thủ kho</div>
        <div class="sig-line">(Ký, ghi rõ họ tên)</div>
      </div>
      <div class="sig-box">
        <div>${dateStr}</div>
        <div style="margin-top:4px">Người bán hàng</div>
        <div class="sig-line">(Ký, ghi rõ họ tên)</div>
      </div>
    </div>
  ` : `
    <!-- HEADER -->
    <div class="header">
      <div class="shop-info">
        <h1>${shopName}</h1>
        <p>📍 ${shopAddr}</p>
        ${shopPhone ? `<p>📞 ${shopPhone}</p>` : ""}
        ${shopTax   ? `<p>MST: ${shopTax}</p>`   : ""}
      </div>
      <div class="invoice-title">
        <h2>${type === "wholesale" ? "HOÁ ĐƠN BÁN SỈ" : "HOÁ ĐƠN BÁN HÀNG"}${order.is_quick ? ` <span style="color:#dc2626">(NHÁP)</span>` : ""}</h2>
        <div class="inv-no">Số: <strong>${order.order_number}</strong></div>
        <div class="inv-date">${dateStr}</div>
        ${order.is_quick ? `<div class="inv-date" style="color:#dc2626">Hoá đơn tạm tính — không lưu vào danh sách chính thức</div>` : ""}
      </div>
    </div>
    <div class="divider"></div>

    <!-- KHÁCH HÀNG -->
    <div class="customer-grid">
      <span class="label">Khách hàng:</span>
      <span class="val">${order.customer_name || "Khách vãng lai"}</span>
      <span class="label">SĐT:</span>
      <span class="val">${order.customer_phone || ""}</span>
      ${order.customer_id_card ? `
        <span class="label">CCCD/CMND:</span>
        <span class="val" style="grid-column: 2/5">${order.customer_id_card}</span>
      ` : ""}
      ${order.customer_address ? `
        <span class="label">Địa chỉ:</span>
        <span class="val" style="grid-column: 2/5">${order.customer_address}</span>
      ` : ""}
    </div>
    ${hasGoldModel ? `
      <div style="font-size:12pt; margin: 4px 0;">💰 Giá vàng 99/chỉ áp dụng cho toa: <strong>${fmtVND(order.gold_price_99)}</strong>/chỉ</div>
    ` : ""}
    <div class="divider-thin"></div>

    <!-- BẢNG HÀNG HÓA -->
    ${hasGoldModel ? `
    <table>
      <thead>
        <tr>
          <th style="width:26px">STT</th>
          <th>Tên hàng</th>
          <th style="width:36px">SL</th>
          <th style="width:70px">TL vàng+hột</th>
          <th style="width:60px">TL hột</th>
          <th style="width:70px">Tổng TL Vàng</th>
          <th style="width:50px">Tuổi Vàng</th>
          <th style="width:70px">Sau Quy Đổi</th>
          <th style="width:80px">Công/món</th>
          <th style="width:90px">Thành Tiền Công</th>
        </tr>
      </thead>
      <tbody>
        ${(items||[]).map((item, i) => {
          let md = null;
          try { md = item.metal_details ? JSON.parse(item.metal_details) : null; } catch { md = null; }
          return `
          <tr>
            <td class="center">${i+1}</td>
            <td>${item.product_name}${item.sku ? ` <span style="color:#666; font-size:11pt">(${item.sku})</span>` : ""}</td>
            <td class="center">${item.quantity}</td>
            <td class="center">${md ? md.grossWeight.toFixed(3) : "—"}</td>
            <td class="center">${md ? (md.stoneWeight||0).toFixed(3) : "—"}</td>
            <td class="center">${md ? (md.netWeight * item.quantity).toFixed(3) : "—"}</td>
            <td class="center">${md ? md.purity : "—"}</td>
            <td class="center">${md ? md.conv99.toFixed(3) : "—"}</td>
            <td class="right">${fmtVND(item.unit_price)}</td>
            <td class="right">${fmtVND(item.total)}</td>
          </tr>
        `; }).join("")}
        <!-- Dòng trống để đủ nhiều dòng nếu ít hàng (bán sỉ thường muốn chữ ký chân) -->
        ${Array.from({length: Math.max(0, 5 - (items||[]).length)}).map(() =>
          `<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`
        ).join("")}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="9" style="text-align:right">Tạm tính (tổng tiền công):</td>
          <td class="right">${fmtVND(order.subtotal)}</td>
        </tr>
        ${parseInt(order.discount||0) > 0 ? `
          <tr>
            <td colspan="9" style="text-align:right">Giảm giá:</td>
            <td class="right">- ${fmtVND(order.discount)}</td>
          </tr>
        ` : ""}
      </tfoot>
    </table>
    ` : `
    <table>
      <thead>
        <tr>
          <th style="width:32px">STT</th>
          <th>Tên hàng hóa</th>
          <th style="width:46px">SL</th>
          <th style="width:110px">Đơn giá</th>
          <th style="width:50px">CK</th>
          <th style="width:120px">Thành tiền</th>
        </tr>
      </thead>
      <tbody>
        ${(items||[]).map((item, i) => `
          <tr>
            <td class="center">${i+1}</td>
            <td>${item.product_name}${item.sku ? ` <span style="color:#666; font-size:11pt">(${item.sku})</span>` : ""}</td>
            <td class="center">${item.quantity}</td>
            <td class="right">${fmtVND(item.unit_price)}</td>
            <td class="center">${parseInt(item.discount||0) > 0 ? fmtVND(item.discount) : "—"}</td>
            <td class="right">${fmtVND(item.total)}</td>
          </tr>
        `).join("")}
        <!-- Dòng trống để đủ 10 dòng nếu ít hàng (bán sỉ thường muốn chữ ký chân) -->
        ${type === "wholesale" ? Array.from({length: Math.max(0, 5 - (items||[]).length)}).map(() =>
          `<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>`
        ).join("") : ""}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="5" style="text-align:right">Tạm tính:</td>
          <td class="right">${fmtVND(order.subtotal)}</td>
        </tr>
        ${parseInt(order.discount||0) > 0 ? `
          <tr>
            <td colspan="5" style="text-align:right">Giảm giá:</td>
            <td class="right">- ${fmtVND(order.discount)}</td>
          </tr>
        ` : ""}
      </tfoot>
    </table>
    `}

    <!-- HÀNG CŨ KHÁCH TRẢ (THU LẠI) -->
    ${tradeIns.length ? (isGoldTradeIn ? `
      <div style="font-weight:bold; margin: 12px 0 4px;">🔄 Hàng cũ khách trả (thu lại)</div>
      <table>
        <thead>
          <tr>
            <th>Tên hàng</th>
            <th style="width:60px">Tuổi</th>
            <th style="width:80px">TL luôn hột</th>
            <th style="width:70px">Hột</th>
            <th style="width:80px">TL Vàng</th>
            <th style="width:110px">Dê sau quy đổi</th>
          </tr>
        </thead>
        <tbody>
          ${tradeIns.map(t => {
            // Tương thích ngược: hoá đơn tạo trước khi có cột trừ hao chỉ lưu "weight"
            // (net), không có grossWeight/stoneWeight — khi đó coi như hột = 0.
            const gross = parseFloat(t.grossWeight ?? t.weight) || 0;
            const stone = parseFloat(t.stoneWeight) || 0;
            const net   = parseFloat(t.weight) || 0;
            return `
            <tr>
              <td>${t.name || ""}</td>
              <td class="center">${t.purity ?? ""}</td>
              <td class="center">${gross.toFixed(3)}</td>
              <td class="center">${stone.toFixed(3)}</td>
              <td class="center">${net.toFixed(3)}</td>
              <td class="right">${(parseFloat(t.conv99)||0).toFixed(3)}</td>
            </tr>
          `; }).join("")}
        </tbody>
      </table>
    ` : `
      <div style="font-weight:bold; margin: 12px 0 4px;">🔄 Hàng cũ khách trả (thu lại)</div>
      <table>
        <thead>
          <tr>
            <th>Tên hàng</th>
            <th style="width:90px">TL (chỉ)</th>
            <th style="width:130px">Giá vàng/chỉ</th>
            <th style="width:130px">Thành tiền</th>
          </tr>
        </thead>
        <tbody>
          ${tradeIns.map(t => `
            <tr>
              <td>${t.name || ""}</td>
              <td class="center">${t.weight ?? ""}</td>
              <td class="right">${fmtVND(t.pricePerUnit)}</td>
              <td class="right">${fmtVND(t.amount)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `) : ""}

    <!-- TỔNG CỘNG -->
    <div class="totals">
      ${hasGoldModel ? `
        <table class="totals-table" style="margin-right: 30px;">
          <tr><th>🥇 Bán ra (99):</th><td>${goldSold99.toFixed(3)} chỉ</td></tr>
          <tr><th>Mua vào (99):</th><td>${goldBought99.toFixed(3)} chỉ</td></tr>
          <tr><th>Còn lại (99):</th><td>${goldRemaining99.toFixed(3)} chỉ</td></tr>
          <tr><th>Quy ra tiền (99):</th><td>${goldToMoney99.toFixed(3)} chỉ</td></tr>
          <tr><th>Tiền công:</th><td>${fmtVND(order.making_fee_total)}</td></tr>
          ${Math.abs(goldDebt99) > 0.0005 ? `
            <tr class="debt-row"><th>Nợ vàng còn lại:</th><td>${goldDebt99.toFixed(3)} chỉ</td></tr>
          ` : ""}
        </table>
      ` : ""}
      <table class="totals-table">
        <tr class="total-final">
          <th>TỔNG CỘNG:</th>
          <td>${fmtVND(order.total)}</td>
        </tr>
        ${(payments||[]).map(p => `
          <tr>
            <th>${methodLabel(p.method)}:</th>
            <td>${fmtVND(p.amount)}</td>
          </tr>
        `).join("")}
        ${debtAmount > 0 ? `
          <tr class="debt-row">
            <th>${hasGoldModel ? "Nợ tiền:" : "Còn nợ:"}</th>
            <td>${fmtVND(debtAmount)}</td>
          </tr>
        ` : ""}
      </table>
    </div>

    <!-- GHI CHÚ -->
    ${order.notes ? `<div class="notes">📝 Ghi chú: ${order.notes}</div>` : ""}
    ${type === "wholesale" ? `
      <div class="notes">
        * Hàng hoá đã kiểm tra đúng số lượng, chất lượng trước khi giao.<br/>
        * Đề nghị thanh toán theo đúng hạn ghi trên hoá đơn.
      </div>
    ` : ""}

    <!-- CHỮ KÝ -->
    <div class="signatures">
      <div class="sig-box">
        <div>Khách hàng</div>
        <div class="sig-line">(Ký, ghi rõ họ tên)</div>
      </div>
      ${type === "wholesale" ? `
        <div class="sig-box">
          <div>Thủ kho</div>
          <div class="sig-line">(Ký, ghi rõ họ tên)</div>
        </div>
      ` : ""}
      <div class="sig-box">
        <div>${dateStr}</div>
        <div style="margin-top:4px">Người bán hàng</div>
        <div class="sig-line">(Ký, ghi rõ họ tên)</div>
      </div>
    </div>
  `;

  document.getElementById("inv-title-bar").textContent =
    `${type === "wholesale" ? "Bán sỉ" : "Bán lẻ"} — ${order.order_number}`;
  if (!params.get("noprint")) setTimeout(() => window.print(), 500);
}

load().catch(err => { document.getElementById("invoice").textContent = "Lỗi: " + err.message; });
</script>
</body>
</html>
