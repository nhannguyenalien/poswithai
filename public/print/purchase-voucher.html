<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <title>Chứng từ mua vào</title>
  <style>
    @page { size: A4; margin: 15mm 15mm 20mm 15mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Times New Roman', Times, serif; font-size: 13pt; color: #000; background: #fff; }

    .toolbar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      background: #1e293b; padding: 10px 16px;
      color: #fff; gap: 8px; align-items: center;
    }
    .toolbar button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-print { background: #22c55e; color: #fff; }
    .btn-close  { background: #ef4444; color: #fff; }

    @media screen {
      .toolbar { display: flex; }
      body { padding-top: 50px; background: #e5e7eb; }
      .a4 { background: #fff; max-width: 210mm; margin: 20px auto; padding: 20mm 18mm; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
    }
    @media print { .toolbar { display: none !important; } .a4 { padding: 0; } }

    .pv-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; font-size: 12pt; }
    .pv-header-right { text-align: center; font-size: 11pt; }
    .pv-italic { font-style: italic; margin-top: 2px; }
    .pv-title { text-align: center; font-size: 18pt; font-weight: 700; margin: 18px 0 10px; line-height: 1.35; }
    .pv-section-title { text-align: center; font-weight: 700; margin-bottom: 10px; font-size: 13pt; }
    .pv-grid { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 10px; align-items: end; margin-bottom: 14px; font-size: 12pt; }
    .pv-grid label { white-space: nowrap; font-weight: 600; }
    .pv-full { grid-column: 1 / 2; }
    .pv-val { border-bottom: 1px dashed #666; min-height: 18px; padding: 0 4px 2px; }
    .pv-full-val { grid-column: 2 / -1; }

    table.pv-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 11pt; }
    .pv-table th, .pv-table td { border: 1px solid #000; padding: 5px 7px; vertical-align: middle; }
    .pv-table th { background: #f3f4f6; font-weight: 700; text-align: center; }
    .pv-table td.center { text-align: center; }
    .pv-table td.right { text-align: right; }
    .pv-table tbody td:nth-child(2) { text-align: left; }
    .pv-table tfoot td { text-align: right; font-weight: 700; background: #f9fafb; }

    .pv-words { margin: 10px 0 14px; font-size: 12pt; }
    .pv-commit-title { text-decoration: underline; }
    .pv-commit { margin-bottom: 18px; font-size: 12pt; line-height: 1.5; }
    .pv-date { text-align: right; font-weight: 700; margin-bottom: 6px; }
    .pv-signatures { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; font-weight: 700; }
    .pv-sign-hint { font-weight: 400; font-style: italic; margin-top: 55px; }

    .center { text-align: center; }
  </style>
</head>
<body>

<div class="toolbar">
  <button class="btn-print" onclick="window.print()">🖨️ In chứng từ</button>
  <button class="btn-close" onclick="window.close()">✕ Đóng</button>
</div>

<div class="a4" id="voucher">
  <div class="center" style="padding:40px; color:#999">Đang tải chứng từ...</div>
</div>

<script type="module">
import { getToken } from "/js/auth.js";

const params  = new URLSearchParams(location.search);
const orderId = params.get("order_id");

const fmt = n => Number(n || 0).toLocaleString("vi-VN");
const fmtG3 = n => Number(n || 0).toFixed(3);

// Đọc số tiền thành chữ (VNĐ) cho dòng "Bằng chữ" — giống hệt logic dùng ở
// gold-invoice.html để chứng từ mua vào luôn hiển thị nhất quán dù in từ đâu.
function amountToWords(amount) {
  const digits   = ["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
  const bigUnits = ["", "nghìn", "triệu", "tỷ", "nghìn tỷ", "triệu tỷ"];

  function readGroup(num, forcePad) {
    const h = Math.floor(num / 100), t = Math.floor((num % 100) / 10), u = num % 10;
    const out = [];
    if (h > 0 || forcePad) out.push(h > 0 ? digits[h] + " trăm" : "không trăm");
    if (t === 0) {
      if (u > 0 && (h > 0 || forcePad)) out.push("linh");
    } else if (t === 1) {
      out.push("mười");
    } else {
      out.push(digits[t] + " mươi");
    }
    if (u === 1 && t >= 2) out.push("mốt");
    else if (u === 5 && t >= 1) out.push("lăm");
    else if (u > 0) out.push(digits[u]);
    return out.join(" ");
  }

  let n = Math.round(Math.abs(amount) || 0);
  if (n === 0) return "Không đồng";
  const groups = [];
  while (n > 0) { groups.unshift(n % 1000); n = Math.floor(n / 1000); }
  const words = [];
  groups.forEach((g, idx) => {
    if (g === 0) return;
    const unitIdx = groups.length - 1 - idx;
    words.push(readGroup(g, idx > 0) + (bigUnits[unitIdx] ? " " + bigUnits[unitIdx] : ""));
  });
  const text = words.join(" ").replace(/\s+/g, " ").trim();
  return text.charAt(0).toUpperCase() + text.slice(1) + " đồng";
}

async function load() {
  if (!orderId) { document.getElementById("voucher").textContent = "Thiếu order_id"; return; }

  const [orderRes, settingsRes] = await Promise.all([
    fetch(`/api/orders/${orderId}`, { headers: { Authorization: "Bearer " + getToken() } }).then(r => r.json()),
    fetch("/api/settings",          { headers: { Authorization: "Bearer " + getToken() } }).then(r => r.json()).catch(() => ({ settings: {} })),
  ]);

  const { order, payments = [] } = orderRes;
  if (!order) { document.getElementById("voucher").textContent = "Không tìm thấy đơn hàng"; return; }
  const settings = settingsRes.settings || {};

  let tradeIns = [];
  try { tradeIns = order.trade_in_details ? JSON.parse(order.trade_in_details) : []; } catch { tradeIns = []; }
  const rows = tradeIns
    .map(t => ({ name: t.name || "Vàng cũ", weight: parseFloat(t.weight) || 0, price: parseFloat(t.pricePerUnit) || 0, total: parseFloat(t.amount) || 0 }))
    .filter(r => r.weight > 0);

  if (!rows.length) {
    document.getElementById("voucher").innerHTML = `<div class="center" style="padding:40px; color:#999">Đơn hàng này không có hàng dê thu mua để lập chứng từ.</div>`;
    return;
  }

  const shopName = settings.shop_name    || "TÊN CỬA HÀNG";
  const shopAddr = settings.shop_address || "";
  const shopTax  = settings.tax_code     || "";

  // Nhận tiền tài khoản/tiền mặt — suy ra từ các khoản thanh toán thực tế của đơn (đảo
  // dấu vì đơn mua-lại-dê là chiều hoàn tiền cho khách, payments.amount lưu âm).
  const cashAmt     = payments.filter(p => p.method === "cash").reduce((s, p) => s + Math.abs(parseInt(p.amount) || 0), 0);
  const transferAmt = payments.filter(p => p.method !== "cash").reduce((s, p) => s + Math.abs(parseInt(p.amount) || 0), 0);

  const d = new Date(order.created_at || Date.now());
  const dateStr = `${d.getDate().toString().padStart(2,"0")}/${(d.getMonth()+1).toString().padStart(2,"0")}/${d.getFullYear()}`;

  const total = rows.reduce((s, r) => s + r.total, 0);

  document.getElementById("voucher").innerHTML = `
    <div class="pv-header">
      <div>
        <div><b>Doanh nghiệp tư nhân ${shopName}</b></div>
        <div>Mã số thuế: ${shopTax}</div>
        <div>Địa chỉ: ${shopAddr}</div>
      </div>
      <div class="pv-header-right">
        <div>Mã số: ……………</div>
        <div>Mẫu số: 02/TNDN</div>
        <div class="pv-italic">(Ban hành kèm theo Thông tư số 20/2026 TT-BTC<br/>của Bộ trưởng Bộ Tài chính)</div>
      </div>
    </div>

    <h2 class="pv-title">CHỨNG TỪ MUA VÀO HÀNG HÓA DỊCH VỤ CỦA<br/>CÁ NHÂN KHÔNG KINH DOANH</h2>

    <div class="pv-section-title">Thông tin người bán</div>
    <div class="pv-grid">
      <label>Họ và tên người bán:</label><span class="pv-val">${order.customer_name || ""}</span>
      <label>Điện thoại:</label><span class="pv-val">${order.customer_phone || ""}</span>

      <label class="pv-full">Địa chỉ:</label><span class="pv-val pv-full-val">${order.customer_address || ""}</span>

      <label>CCCD</label><span class="pv-val">${order.customer_id_card || ""}</span>
      <label>Ngày/tháng/năm sinh:</label><span class="pv-val">${order.customer_dob || ""}</span>

      <label class="pv-full">Ngày cấp:</label><span class="pv-val pv-full-val">${order.customer_id_issue_date || ""}</span>

      <label>Ngân hàng:</label><span class="pv-val">${order.customer_bank_name || ""}</span>
      <label>Số tài khoản:</label><span class="pv-val">${order.customer_bank_account || ""}</span>

      <label class="pv-full">Nhận tiền tài khoản:</label><span class="pv-val pv-full-val">${transferAmt > 0 ? fmt(transferAmt) + " đ" : ""}</span>

      <label class="pv-full">Nhận tiền mặt:</label><span class="pv-val pv-full-val">${cashAmt > 0 ? fmt(cashAmt) + " đ" : ""}</span>
    </div>

    <table class="pv-table">
      <thead>
        <tr>
          <th rowspan="2" style="width:26px">TT</th>
          <th colspan="6">CHI TIẾT HÀNG HÓA MUA VÀO</th>
        </tr>
        <tr>
          <th>Tên hàng hóa</th>
          <th style="width:56px">Đơn vị</th>
          <th style="width:70px">Trọng lượng</th>
          <th style="width:70px">Loại vàng</th>
          <th style="width:100px">Đơn giá (VNĐ)</th>
          <th style="width:110px">Thành tiền (VNĐ)</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((r, i) => `
        <tr>
          <td class="center">${i + 1}</td>
          <td>${r.name}</td>
          <td class="center">chỉ</td>
          <td class="center">${fmtG3(r.weight)}</td>
          <td class="center"></td>
          <td class="right">${fmt(r.price)}</td>
          <td class="right">${fmt(r.total)}</td>
        </tr>`).join("")}
      </tbody>
      <tfoot>
        <tr><td colspan="6" style="text-align:right">Tổng cộng:</td><td class="right">${fmt(total)} đ</td></tr>
      </tfoot>
    </table>

    <div class="pv-words"><i><b>Bằng chữ:</b></i> ${amountToWords(total)}</div>

    <div class="pv-commit">
      <b class="pv-commit-title">CAM KẾT XÁC NHẬN:</b><br/>
      Tôi cam kết toàn bộ vàng bán ra là tài sản chính chủ, có nguồn gốc hợp pháp, không phải hàng
      gian, hàng trộm cắp, hàng cấm. Tôi chịu trách nhiệm hoàn toàn trước pháp luật về tính trung
      thực của thông tin đã cung cấp cho doanh nghiệp.<br/>
      Tôi đồng ý giao dịch bán tài sản này tại <b>DNTN ${shopName.toUpperCase()}</b> và đã nhận đủ
      số tiền thu mua nêu trên.<br/>
      <i>(Hai bên đã đồng kiểm và đánh giá trực tiếp tại tiệm vàng)</i>
    </div>

    <div class="pv-date">Ngày lập phiếu ${dateStr}</div>
    <div class="pv-signatures">
      <div><b>NGƯỜI MUA HÀNG</b><div class="pv-sign-hint">(Ký tên)</div></div>
      <div><b>KHÁCH HÀNG</b><div class="pv-sign-hint">(Ký, ghi rõ họ tên)</div></div>
      <div><b>NHÂN VIÊN</b><div class="pv-sign-hint">(Ký tên)</div></div>
    </div>
  `;
}

load().catch(err => {
  document.getElementById("voucher").innerHTML = `<div class="center" style="padding:40px; color:#c00">Lỗi tải chứng từ: ${err.message}</div>`;
});
</script>
</body>
</html>
