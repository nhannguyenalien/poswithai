<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tạo mật khẩu — POS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css"/>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-5">
    <div class="text-center mb-4">
      <div style="font-size:3rem">🔐</div>
      <h2 class="fw-bold mt-2">Tạo mật khẩu đăng nhập</h2>
      <p class="text-muted">Sau này bạn có thể đăng nhập bằng email và mật khẩu, hoặc tiếp tục dùng Google.</p>
    </div>
    <div class="card">
      <form id="password-form" class="card-body p-4">
        <div id="msg" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu mới</label>
          <input id="password" type="password" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required/>
          <small class="form-hint">Ít nhất 8 ký tự.</small>
        </div>
        <div class="mb-3">
          <label class="form-label">Nhập lại mật khẩu</label>
          <input id="password-confirmation" type="password" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required/>
        </div>
        <button id="btn-save" type="submit" class="btn btn-primary w-100">Lưu mật khẩu</button>
        <a href="/dashboard.html" class="btn btn-link w-100 mt-2">Để sau</a>
      </form>
    </div>
  </div>
</div>
<script type="module">
  import { requireLogin, getToken } from "/js/auth.js";
  requireLogin();

  document.getElementById("password-form").addEventListener("submit", async event => {
    event.preventDefault();
    const password = document.getElementById("password").value;
    const confirmation = document.getElementById("password-confirmation").value;
    const message = document.getElementById("msg");
    const button = document.getElementById("btn-save");
    message.classList.add("d-none");
    if (password !== confirmation) {
      message.textContent = "Mật khẩu nhập lại không khớp";
      message.classList.remove("d-none");
      return;
    }
    button.disabled = true;
    button.textContent = "Đang lưu...";
    try {
      const response = await fetch("/api/auth/password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${getToken()}` },
        body: JSON.stringify({ password, password_confirmation: confirmation }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Không lưu được mật khẩu");
      message.className = "alert alert-success";
      message.textContent = `Đã tạo mật khẩu cho ${data.email}. Đang chuyển vào POS...`;
      setTimeout(() => { window.location.href = "/dashboard.html"; }, 900);
    } catch (error) {
      message.className = "alert alert-danger";
      message.textContent = error.message;
      button.disabled = false;
      button.textContent = "Lưu mật khẩu";
    }
  });
</script>
</body>
</html>
